name: Bootstrap deploy server (one-time)

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Add deploy key and inspect server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_BOOTSTRAP_PASSWORD }}
        run: |
          set -eu

          missing=""
          if [ -z "$SSH_HOST" ]; then missing="$missing SSH_HOST"; fi
          if [ -z "$SSH_USER" ]; then missing="$missing SSH_USER"; fi
          if [ -z "$SSH_PASSWORD" ]; then missing="$missing SSH_BOOTSTRAP_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::These secrets are empty or unset:$missing"
            exit 1
          fi
          # Lengths only (not values) — expected: SSH_HOST=13 ("46.62.141.176"),
          # SSH_USER=4 ("root"), SSH_PASSWORD=20. A mismatch here (extra
          # whitespace/newline in the secret) is the likely culprit if these
          # don't match — GitHub redacts the actual secret text from logs
          # regardless, so printing the values themselves wouldn't help.
          echo "lengths -> SSH_HOST=${#SSH_HOST} SSH_USER=${#SSH_USER} SSH_PASSWORD=${#SSH_PASSWORD}"

          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1

          sshpass -p "$SSH_PASSWORD" ssh -vvv -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$SSH_USER@$SSH_HOST" 'sh -s' < scripts/bootstrap-remote.sh
